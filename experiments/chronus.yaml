Frontend:
  impl: BHO3
  clock_ratio: 8
  num_expected_insts: 512
  llc_capacity_per_core: 1KB
  traces:
    - ordinary.trace
  Translation:
    impl: NoTranslation
    max_addr: 17179869184

MemorySystem:
  impl: BHDRAMSystem
  clock_ratio: 3
  DRAM:
    impl: DDR5-VRR
    org:
      preset: DDR5_16Gb_x8
      channel: 1
      rank: 2
    timing:
      preset: DDR5_3200AN
    RFM:
      BRC: 2
    PRAC: false
    chronus_enable: true
    chronus_energy_factor: 1.1907
  BHDRAMController:
    impl: ChronusDRAMController
    BHScheduler:
      impl: PRACScheduler
    RefreshManager:
      impl: AllBank
    RowPolicy:
      impl: CloseRowPolicy
      cap: 0
    plugins:
      - ControllerPlugin:
          impl: Chronus
          trefi_vrr_rate: 2
          abo_threshold: 1020
      - ControllerPlugin:
          impl: TraceRecorder
          path: commands/trace
  AddrMapper:
    impl: RoBaRaCoCh_with_rit
