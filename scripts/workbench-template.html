<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DRAMdpnd workbench</title>
<style>
:root{color-scheme:dark;--bg:#0a101a;--side:#0e1724;--panel:#111d2c;--panel2:#152438;--line:#293b51;--text:#e6edf5;--muted:#9badc0;--accent:#6cb7d6;--good:#74c69a;--warn:#e8bc70;--bad:#e78989;font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select{font:inherit}a{color:#9ed8ef;text-decoration:none}a:hover{text-decoration:underline}code,pre,.mono,td.num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}code{font-size:.92em}button{cursor:pointer}
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--side);border-right:1px solid var(--line);padding:24px 14px;position:sticky;top:0;height:100vh}.brand{font-size:21px;font-weight:720;letter-spacing:-.04em;padding:0 11px 5px}.subbrand{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:0 11px 28px}.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;color:var(--muted);text-align:left;padding:10px 11px;border-radius:8px}.nav button:hover,.nav button[aria-current="page"]{background:var(--panel2);color:var(--text)}.nav button[aria-current="page"]{box-shadow:inset 3px 0 var(--accent)}.sidefoot{position:absolute;bottom:22px;left:25px;right:15px;color:var(--muted);font-size:11px}
main{min-width:0;padding:26px 34px 58px;max-width:1580px;width:100%;margin:auto}.topline{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:1px solid var(--line);padding-bottom:19px;margin-bottom:28px}.topline small{color:var(--muted)}.topline strong{font-size:16px}.view{display:none}.view.active{display:block}h1{font-size:25px;letter-spacing:-.035em;margin:0 0 5px}h2{font-size:17px;letter-spacing:-.02em;margin:0 0 13px}h3{font-size:14px;margin:0 0 9px}.lede{color:var(--muted);margin:0 0 24px;max-width:950px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px}.grid.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:18px;min-width:0;margin-bottom:14px}.panel .panel{background:var(--panel2);margin:0}.metric{font-size:28px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.caption{color:var(--muted);font-size:12px;margin:8px 0 0}.section-gap{margin-top:23px}.pill{display:inline-block;padding:2px 8px;border-radius:20px;background:#22374a;color:#d3e7f0;font-size:11px;font-weight:650;letter-spacing:.02em}.pill.VALID,.pill.SUCCESS,.pill.available{background:#173f35;color:var(--good)}.pill.INVALID,.pill.FAILED{background:#4b282d;color:var(--bad)}.pill.UNVERIFIED,.pill.INCOMPLETE,.pill.INTERRUPTED,.pill.UNSUPPORTED{background:#4b3b26;color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--muted);font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--line);padding:9px 11px}td{padding:10px 11px;border-bottom:1px solid #203144;vertical-align:top}tr:last-child td{border-bottom:0}td.num{text-align:right;font-variant-numeric:tabular-nums}tbody tr.selectable{cursor:pointer}tbody tr.selectable:hover{background:#1a2c41}tbody tr.selected{background:#20374d}.tablewrap{overflow:auto}.controls{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 14px}input,select{background:#0e1a28;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:8px 10px;min-height:36px}input[type=search]{min-width:240px;flex:1}.button{background:#1b3a50;border:1px solid #3e6880;color:#e7f5fb;border-radius:7px;padding:8px 12px;display:inline-block}.button:hover{background:#28516c;text-decoration:none}.kv{display:grid;grid-template-columns:minmax(140px,210px) minmax(0,1fr);gap:8px 14px}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}.warning{border-left:3px solid var(--warn);background:#352b1d;padding:10px 12px;border-radius:5px;color:#f2d9a6;margin:8px 0}.error{border-color:var(--bad);background:#3b242b;color:#f2b4b4}.empty{color:var(--muted);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:7px}.barrow{display:grid;grid-template-columns:minmax(78px,165px) minmax(80px,1fr) 55px;align-items:center;gap:10px;margin:7px 0;font-size:12px}.barlabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:9px;background:#223347;border-radius:9px;overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:9px}.barrow .num{text-align:right;font-variant-numeric:tabular-nums}.stack{display:grid;gap:14px}pre{background:#0b1623;border:1px solid var(--line);border-radius:8px;color:#d5e3ee;overflow:auto;white-space:pre;max-height:340px;padding:13px;font-size:12px;line-height:1.55}.fileline{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #203144}.fileline:last-child{border:0}.small{font-size:12px;color:var(--muted)}.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}.stat{background:#0e1b2a;border:1px solid var(--line);border-radius:7px;padding:10px}.stat .num{font-family:ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:16px}.stat .label{overflow-wrap:anywhere}.footer{margin-top:40px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:12px}
@media(max-width:820px){.shell{grid-template-columns:minmax(0,1fr)}.sidebar{position:static;height:auto;padding:15px}.brand,.subbrand{display:inline-block;padding:0 10px 8px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.sidefoot{display:none}main{padding:20px 16px 40px}.topline{margin-bottom:20px}.kv{grid-template-columns:1fr}.kv dt{margin-top:8px}}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}.shell,.view{min-width:0;max-width:100%}.lede,main{overflow-wrap:anywhere}.topline{flex-wrap:wrap}.metric,.panel,.fileline,.small,code{overflow-wrap:anywhere}.fileline{flex-wrap:wrap}.fileline>*{min-width:0}.tablewrap{max-width:100%}@media(max-width:520px){main{padding:16px 12px 32px}.panel{padding:13px}.grid{grid-template-columns:minmax(0,1fr)}.barrow{grid-template-columns:minmax(66px,110px) minmax(40px,1fr) 45px;gap:6px}}
</style>
</head>
<body>
<div class="shell"><aside class="sidebar"><div class="brand">DRAMdpnd</div><div class="subbrand">DRAM dependability</div><nav class="nav" aria-label="Workbench sections"><button data-view="overview" aria-current="page">Overview</button><button data-view="experiments">Experiments</button><button data-view="runs">Run history</button><button data-view="evidence">Evidence inspector</button><button data-view="observations">Observations</button><button data-view="dependability">Dependability lab</button><button data-view="figures">Figures</button><button data-view="sources">Research sources</button><button data-view="environment">Environment</button></nav><div class="sidefoot">Local files only · no server or account</div></aside><main><div class="topline"><strong id="context">Workspace overview</strong><small id="generated"></small></div><section id="overview" class="view active"></section><section id="experiments" class="view"></section><section id="runs" class="view"></section><section id="evidence" class="view"></section><section id="observations" class="view"></section><section id="dependability" class="view"></section><section id="figures" class="view"></section><section id="sources" class="view"></section><section id="environment" class="view"></section><div class="footer">Observations are native records. Measurements are calculations from those records. Property interpretation requires a separate service requirement and model.</div></main></div>
<script type="application/json" id="workbench-data">__DRAMDPD_DATA__</script>
<script>
const D=JSON.parse(document.getElementById('workbench-data').textContent);
let selected=D.runs.find(r=>r.evidence==='VALID')?.id||D.runs[0]?.id||null;
let view='overview';
const h=v=>String(v??'unavailable').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pill=v=>`<span class="pill ${h(v)}">${h(v)}</span>`;
const num=v=>v===null||v===undefined?'unavailable':Number(v).toLocaleString();
const current=()=>D.runs.find(r=>r.id===selected);
const intro=(title,text)=>`<h1>${title}</h1><p class="lede">${text}</p>`;
const empty=text=>`<div class="empty">${h(text)}</div>`;
const link=(url,label)=>`<a href="${h(url)}" target="_blank" rel="noopener">${h(label)}</a>`;
const sourceUrl=r=>{let source=D.sources.find(s=>s.artifact===r.artifact);return source&&r.source_revision===source.pin?source.repository+'/tree/'+source.pin:null;};
const bars=(data,limit=12)=>{let pairs=Object.entries(data||{}).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,limit),max=Math.max(1,...pairs.map(x=>x[1]));return pairs.length?pairs.map(([name,value])=>`<div class="barrow"><span class="barlabel" title="${h(name)}">${h(name)}</span><div class="track"><div class="fill" style="width:${100*value/max}%"></div></div><span class="num">${num(value)}</span></div>`).join(''):empty('No recorded values');};
const recordLink=(r,file)=>`../${encodeURIComponent(r.artifact)}/${encodeURIComponent(r.id)}/${file.split('/').map(encodeURIComponent).join('/')}`;
function overview(){let groups={VALID:0,UNVERIFIED:0,INVALID:0,INCOMPLETE:0,UNSUPPORTED:0};for(const r of D.runs)groups[r.evidence]=(groups[r.evidence]||0)+1;let failed=D.runs.filter(r=>r.execution==='FAILED'||r.execution==='INTERRUPTED').length;let sourceCards=D.sources.map(s=>`<div class="panel"><div class="label">${h(s.artifact)} · ${h(s.trace_format)}</div><h2 style="margin-top:9px">${h(s.artifact==='ramulator'?'Upstream Ramulator 2.1':s.artifact.toUpperCase())}</h2><p>${pill(s.binary_available?'available':'unavailable')} executable &nbsp; ${pill(s.source_clean?'available':'unavailable')} pinned tracked source &nbsp; ${pill(s.execution_ready?'available':'unavailable')} execution ready</p><p class="caption">${h(s.command)}</p></div>`).join('');return intro('DRAM dependability workbench','Study recorded DRAM commands, logical resources, and measurement limits using four separate research implementations. These ordinary examples are not paper-result reproductions.')+`<div class="grid"><div class="panel"><div class="label">Runs with validated evidence</div><div class="metric">${groups.VALID}</div></div><div class="panel"><div class="label">Unverified legacy or manual runs</div><div class="metric">${groups.UNVERIFIED}</div></div><div class="panel"><div class="label">Failed executions</div><div class="metric">${failed}</div></div><div class="panel"><div class="label">Invalid, incomplete, or unsupported evidence</div><div class="metric">${groups.INVALID+groups.INCOMPLETE+groups.UNSUPPORTED}</div></div><div class="panel"><div class="label">Current Docker image</div><div class="metric" style="font-size:17px;margin-top:9px">${D.docker_image?'Available':'Unavailable'}</div><p class="caption">${h(D.docker_image||'Current image check did not succeed')}</p></div></div><h2 class="section-gap">Simulator backends</h2><div class="grid">${sourceCards}</div><div class="warning">A successful simulator exit and a valid command trace are separate facts. The command trace does not include every accepted or completed memory request.</div>`;}
function experiments(){return intro('Experiment library','Each command uses a fixed project-owned ordinary workload and a pinned original simulator. The interface does not edit or launch configurations.')+`<div class="panel tablewrap"><table><thead><tr><th>Artifact</th><th>Input configuration</th><th>Workload</th><th>Command</th><th>Trace</th></tr></thead><tbody>${D.sources.map(s=>`<tr><td>${h(s.artifact)}</td><td><code>${h(s.experiment)}</code></td><td><code>experiments/ordinary.trace${s.artifact==='wmb'?' + idle.trace':''}</code></td><td><code>${h(s.command)}</code></td><td>${h(s.trace_format)}</td></tr>`).join('')}</tbody></table></div><p class="caption">The configurations are simulator inputs. Resolved runtime defaults have not been captured by these artifacts.</p>`;}
function runRows(){let q=document.getElementById('run-search')?.value.toLowerCase()||'',artifact=document.getElementById('run-artifact')?.value||'',status=document.getElementById('run-status')?.value||'',execution=document.getElementById('run-execution')?.value||'',trace=document.getElementById('run-trace')?.value||'';let shown=D.runs.filter(r=>(!artifact||r.artifact===artifact)&&(!status||r.evidence===status)&&(!execution||r.execution===execution)&&(!trace||r.trace===trace)&&(`${r.id} ${r.artifact} ${r.execution} ${r.evidence}`.toLowerCase().includes(q)));document.getElementById('run-body').innerHTML=shown.length?shown.map(r=>`<tr class="selectable ${r.id===selected?'selected':''}" data-id="${h(r.id)}"><td>${h(r.artifact)}</td><td class="mono">${h(r.id)}</td><td>${pill(r.execution)}</td><td>${pill(r.evidence)}</td><td class="num">${r.wall_seconds===null||r.wall_seconds===undefined?'—':num(r.wall_seconds)}</td><td>${h(r.started?.slice(0,19)||'—')}</td></tr>`).join(''):`<tr><td colspan="6">${empty('No runs match these filters')}</td></tr>`;document.querySelectorAll('#run-body tr[data-id]').forEach(row=>row.addEventListener('click',()=>{selected=row.dataset.id;show('evidence')}));}
function runs(){return intro('Run history','Filter runs by artifact, execution, evidence, or trace format. Select a run to inspect its native files and provenance.')+`<div class="controls"><input id="run-search" type="search" placeholder="Search run ID or status" aria-label="Search runs"><select id="run-artifact" aria-label="Filter artifact"><option value="">All artifacts</option>${D.sources.map(s=>`<option>${h(s.artifact)}</option>`).join('')}</select><select id="run-status" aria-label="Filter evidence"><option value="">All evidence states</option>${['VALID','UNVERIFIED','INVALID','INCOMPLETE','UNSUPPORTED'].map(x=>`<option>${x}</option>`).join('')}</select><select id="run-execution" aria-label="Filter execution"><option value="">All execution states</option>${['SUCCESS','FAILED','INTERRUPTED','INCOMPLETE','UNKNOWN'].map(x=>`<option>${x}</option>`).join('')}</select><select id="run-trace" aria-label="Filter trace format"><option value="">All trace formats</option><option>RAM2BIN</option><option>text</option><option>unavailable</option></select></div><div class="panel tablewrap"><table><thead><tr><th>Artifact</th><th>Run ID</th><th>Execution</th><th>Evidence</th><th>Wall time (s)</th><th>Started UTC</th></tr></thead><tbody id="run-body"></tbody></table></div>`;}
function evidence(){let r=current();if(!r)return intro('Evidence inspector','Select a run from the history.')+empty('No run is selected');let m=r.metadata||{},files=r.files||[],issues=r.issues.map(x=>`<div class="warning ${r.evidence==='INVALID'?'error':''}">${h(x)}</div>`).join('');let options=files.map((f,i)=>`<option value="${i}">${h(f.name)} · ${f.size===null?'missing':num(f.size)+' bytes'}</option>`).join('');let source=sourceUrl({artifact:r.artifact,source_revision:m.source_revision})?link(sourceUrl({artifact:r.artifact,source_revision:m.source_revision}),m.source_revision):h(m.source_revision);return intro('Evidence inspector',`Selected run: <code>${h(r.artifact)}/${h(r.id)}</code>. Raw evidence is preserved; previews are capped at 4 KiB.`)+`<div class="grid two"><div class="panel"><h2>Execution and provenance</h2><dl class="kv"><dt>Execution</dt><dd>${pill(r.execution)}</dd><dt>Evidence</dt><dd>${pill(r.evidence)} ${r.schema===1?'· legacy metadata':''}</dd><dt>Source revision</dt><dd>${source}</dd><dt>Executable SHA-256</dt><dd class="mono">${h(m.simulator_sha256)}</dd><dt>Docker image ID</dt><dd class="mono">${h(m.environment?.image_id)}</dd><dt>Host wall time</dt><dd>${r.wall_seconds===null||r.wall_seconds===undefined?'unavailable':num(r.wall_seconds)+' s'}</dd><dt>Simulator exit</dt><dd>${h(m.exit_status)}</dd><dt>Input configuration</dt><dd class="mono">${h(m.configuration?.file)} · ${h(m.configuration?.sha256)}</dd><dt>Resolved runtime configuration</dt><dd>${m.configuration?.resolved_runtime_config?'recorded':'unavailable'}</dd></dl></div><div class="panel"><h2>Evidence quality</h2>${issues||'<p class="pill VALID">All versioned input and output checks passed</p>'}<p class="caption">Version 2 hashes the native outputs and input copies. Legacy records retain their original metadata and lack an output integrity manifest.</p><h3 class="section-gap">Execution command</h3><pre>${h(Array.isArray(m.command)?m.command.join(' '):'unavailable')}</pre></div></div><div class="panel"><h2>Native file inventory</h2>${files.length?files.map(f=>`<div class="fileline"><span class="mono">${f.size===null?h(f.name):link(recordLink(r,f.name),f.name)}</span><span class="small">${f.size===null?'missing':num(f.size)+' bytes'} · ${f.sha256?h(f.sha256.slice(0,16))+'…':'hash unrecorded'}</span></div>`).join(''):empty('No file inventory in this record')}</div><div class="panel"><h2>Bounded native preview</h2><select id="evidence-file" aria-label="Choose evidence file">${options}</select><div id="evidence-preview"></div></div>`;}
function updatePreview(){let r=current(),index=Number(document.getElementById('evidence-file')?.value||0),f=r?.files?.[index],box=document.getElementById('evidence-preview');if(!box)return;box.innerHTML=f?.preview?`<p class="caption">${h(f.name)} · first 4 KiB${f.preview.truncated?' · truncated':''}</p><pre id="native-text"></pre>`:empty('No text preview is available for this file');let pre=document.getElementById('native-text');if(pre)pre.textContent=f.preview.text;}
function observations(){let r=current();if(!r)return intro('Architectural observations','Select a run to see parsed native evidence.')+empty('No run is selected');let a=r.measurement;if(!a)return intro('Architectural observations',`Selected run: ${h(r.id)}`)+empty('No validated observation summary is available for this record');let entries=Array.isArray(a.native_statistics)?a.native_statistics.map(x=>[`${x.scope}/${x.key} · line ${x.line}`,x.value]):Object.entries(a.native_statistics||{});let stats=entries.filter(([,v])=>typeof v==='number').slice(0,24).map(([k,v])=>`<div class="stat"><div class="label">${h(k)}</div><div class="num">${num(v)}</div></div>`).join('');return intro('Architectural observations',`Parsed ${h(a.trace_format)} from <code>${h(r.artifact)}/${h(r.id)}</code>. Clock values below belong to the controller domain. Source: <code>${h(a.sample_events[0]?.source||"unavailable")}</code>; definitions are in the dependability laboratory.`)+`<div class="grid"><div class="panel"><div class="label">Recorded commands</div><div class="metric">${num(a.event_count)}</div></div><div class="panel"><div class="label">Native ACT records</div><div class="metric">${num(a.measurements.recorded_activations)}</div></div><div class="panel"><div class="label">Observed command span</div><div class="metric">${num(a.span_cycles)} <small>cycles</small></div></div><div class="panel"><div class="label">Model clock period</div><div class="metric">${a.tCK_ps===null?'Unverified':num(a.tCK_ps)+' ps'}</div></div></div><div class="grid two section-gap"><div class="panel"><h2>Native command distribution</h2>${bars(a.command_counts,20)}</div><div class="panel"><h2>Logical bank activity</h2><p class="caption">Channel / rank / bank group / bank. These identifiers are logical coordinates.</p>${bars(a.logical_bank_counts,12)}</div></div><div class="panel"><h2>Native statistics</h2><p class="caption">Original keys from ${h(a.statistics_source)}. Values are not normalized across artifacts; unknown source-defined units remain native.</p><div class="statgrid">${stats||empty('No numeric native statistics')}</div></div><div class="panel"><h2>First native observations</h2><pre id="event-sample"></pre><p class="caption">At most 24 parsed records are shown; follow source and source_line or entry_index to the native trace.</p></div>`;}
function dependability(){let r=current(),a=r?.measurement,defs=a?.measurement_definitions||{},shares=a?.measurements.logical_bank_command_share||{},banks=Object.keys(shares);return intro('Dependability laboratory',`Selected run: <code>${h(r?`${r.artifact}/${r.id}`:'none')}</code>. Native observations support defined measurements; property interpretation needs an explicit requirement and model.`)+(a?`<div class="grid two"><div class="panel"><h2>Reliability-related observations</h2><p>${num(a.measurements.recorded_activations)} native ACT commands were recorded. Refresh identities remain visible in the native command distribution.</p><p class="caption">An activation count or refresh record does not establish a physical fault probability or reliable operation.</p></div><div class="panel"><h2>Security-related observations</h2><p>Protection-related commands and native statistics may be inspected in the observation view and raw evidence.</p><p class="caption">This ordinary run has no defined information-flow test or attack model; confidentiality and integrity remain ${pill('UNSUPPORTED')}.</p></div><div class="panel"><h2>Architectural service behavior</h2><p>The first and last recorded commands span ${num(a.span_cycles)} controller cycles.</p><p class="caption">This span is not the total simulated execution time or a service-unavailability interval.</p></div><div class="panel"><h2>Evaluation evidence</h2><p>${pill(r.evidence)} evidence from <code>${h(a.sample_events[0]?.source||'unavailable')}</code>; ${num(a.event_count)} issued-command records.</p><p class="caption">Evidence integrity and simulation success do not establish architectural correctness or a dependability property.</p></div></div><div class="panel section-gap"><h2>Scoped command counts</h2><p class="caption">Observed logical bank means at least one bank-addressed issued command. Denominator: ${num(a.bank_addressed_commands)} bank-addressed commands in the recorded command span of ${num(a.span_cycles)} controller cycles. These shares are command counts, not bank-time utilization.</p>${banks.length?`<label for="bank-share">Selected logical bank</label> <select id="bank-share" aria-label="Selected logical bank">${banks.map(k=>`<option value="${h(k)}">${h(k)}</option>`).join('')}</select><p id="bank-share-result"></p>`:empty('No complete logical bank coordinates were recorded; a bank command share is unavailable.')}<p class="caption">All configured bank-time and selected-bank state durations are unavailable from these project-owned command counts. Use upstream RamViz for supported reconstructed bank-state views.</p></div><div class="panel section-gap"><h2>Measurement definitions</h2><div class="tablewrap"><table><thead><tr><th>Measurement</th><th>Value</th><th>Definition and method</th><th>Limit</th></tr></thead><tbody>${Object.entries(defs).map(([k,d])=>`<tr><td class="mono">${h(k)}</td><td>${typeof a.measurements[k]==='object'?'see logical-bank panel':h(a.measurements[k]??'unavailable')} ${h(d.unit)}</td><td>${h(d.meaning)}. ${h(d.method)}.</td><td>${h(d.limitation)}</td></tr>`).join('')}</tbody></table></div></div>`:empty('Select an inspectable run for measurement definitions.'))+`<div class="warning">Availability, reliability, integrity, confidentiality, MTTF, FIT, BER, and physical fault probabilities are not established by these command traces.</div>`;}
function updateBankShare(){let r=current(),a=r?.measurement,box=document.getElementById('bank-share-result'),key=document.getElementById('bank-share')?.value;if(!box||!a||!key)return;let count=a.logical_bank_counts[key],share=a.measurements.logical_bank_command_share[key];box.textContent=`Logical bank ${key}: ${count.toLocaleString()} of ${a.bank_addressed_commands.toLocaleString()} bank-addressed commands (${share.toFixed(1)}%).`;}
function figures(){let r=current();if(!r)return intro('Scientific figures','Select a run.')+empty('No run is selected');let items=r.figures.map(path=>`<div class="fileline">${link('../'+path,path.split('/').pop())}<span class="small">${h(path.split(".").pop().toUpperCase())} · local derived file</span></div>`).join('');return intro('Scientific figures',`Generated figures for <code>${h(r.artifact)}/${h(r.id)}</code>. Use <code>./bin/dramdpnd figures ${h(r.id)}</code> to create SVG, PDF, PNG, CSV, and measurement JSON from a valid version 2 run.`)+`<div class="panel"><h2>Available figures</h2>${r.figure_issue?`<div class="warning error">${h(r.figure_issue)}</div>`:''}${items||empty('No verified figures are available for this run')}${r.exports.length?`<h2 class="section-gap">Perfetto exports</h2>${r.exports.map(path=>`<div class="fileline">${link('../'+path,path.split('/').pop())}<span class="small">Chrome JSON · issued-command instants</span></div>`).join('')}`:''}</div><p class="caption">The run directory contains original evidence; generated figures and exports live separately under runs/derived/.</p>`;}
function sources(){return intro('Research sources','Original research trees remain separate and untracked. Full author attribution and observed license boundaries are recorded in THIRD_PARTY.md.')+`<div class="panel tablewrap"><table><thead><tr><th>Artifact</th><th>Paper</th><th>Repository at pin</th><th>Local source</th><th>Executable</th><th>Native trace</th></tr></thead><tbody>${D.sources.map(s=>`<tr><td>${h(s.artifact)}</td><td><em>${h(s.paper)}</em> <span class="small">(${h(s.venue)})</span></td><td>${link(s.repository+'/tree/'+s.pin,s.pin)}</td><td>${pill(s.source_clean?'available':'unavailable')}</td><td>${pill(s.binary_available?'available':'unavailable')}<br><code>${h(s.binary_path)}</code></td><td>${h(s.trace_format)}</td></tr>`).join('')}</tbody></table></div><p>${link(D.documentation.attribution,'Read third-party attribution and licensing observations')}</p>`;}
function environment(){return intro('Environment and diagnostics','These are current, read-only checks at workbench generation time. Run doctor again for live terminal diagnostics.')+`<div class="grid two"><div class="panel"><h2>Host</h2><dl class="kv"><dt>System</dt><dd>${h(D.host)}</dd><dt>Disk free</dt><dd>${h(D.disk_free_gib)} GiB</dd><dt>Python</dt><dd>${h(D.toolchain.python)}</dd><dt>Compiler</dt><dd>${h(D.toolchain.compiler)}</dd><dt>CMake</dt><dd>${h(D.toolchain.cmake)}</dd><dt>Node</dt><dd>${h(D.toolchain.node)}</dd><dt>Docker image</dt><dd class="mono">${h(D.docker_image||'unavailable or not accessible')}</dd><dt>Generated</dt><dd>${h(D.generated_at)}</dd></dl></div><div class="panel"><h2>Practical limits</h2><p>Only upstream Ramulator 2.1 produces native RAM2BIN. The other three artifacts retain text command traces. All traces omit some request lifecycle behavior.</p><p>Perfetto export is available only for valid runs with a verified model clock period. The viewer import must be checked separately.</p></div></div><p>${link(D.documentation.environment,'Environment setup and build notes')} · ${link(D.documentation.exploration,'Exploration guide')} · ${link(D.documentation.measurements,'Measurement definitions')}</p>`;}
const renderers={overview,experiments,runs,evidence,observations,dependability,figures,sources,environment};
function show(name){view=name;document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===name));document.querySelectorAll('.nav button').forEach(x=>x.setAttribute('aria-current',x.dataset.view===name?'page':'false'));document.getElementById('context').textContent=(name==='overview'?'Workspace overview':name.replace(/(^|-)\w/g,x=>x.toUpperCase()))+(['evidence','observations','dependability','figures'].includes(name)&&current()?` · ${current().artifact}/${selected}`:'');let target=document.getElementById(name);target.innerHTML=renderers[name]();if(name==='runs'){['run-search','run-artifact','run-status','run-execution','run-trace'].forEach(id=>document.getElementById(id).addEventListener('input',runRows));runRows()}if(name==='evidence'){document.getElementById('evidence-file')?.addEventListener('change',updatePreview);updatePreview()}if(name==='dependability'){document.getElementById('bank-share')?.addEventListener('change',updateBankShare);updateBankShare()}if(name==='observations'&&current()?.measurement)document.getElementById('event-sample').textContent=current().measurement.sample_events.map(e=>JSON.stringify(e)).join('\n');}
document.querySelectorAll('.nav button').forEach(button=>button.addEventListener('click',()=>show(button.dataset.view)));
document.getElementById('generated').textContent='Generated '+new Date(D.generated_at).toLocaleString();
show('overview');
</script>
</body>
</html>
